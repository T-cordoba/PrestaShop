# SonarQube analysis of the code selected for the V&V project (the 10 units under test and their suites).
sonar.projectKey=prestashop-vv
sonar.projectName=PrestaShop V&V (RF-01..RF-10)
sonar.sourceEncoding=UTF-8

sonar.sources=src/Adapter/Tax,src/Adapter/Zone,src/Adapter/Manufacturer,src/Adapter/Supplier,src/Adapter/Feature,src/Adapter/AbstractObjectModelValidator.php,src/Core/Domain/Country/AddressFormat,src/Core/Grid/Query/ManufacturerQueryBuilder.php
sonar.tests=tests/Unit/VV,tests/Integration/VV

# Coverage is measured only on the units whose every path has a unit test (the integration suites need a database
# and run outside CI); the rest of the sources are analysed but excluded from the coverage denominator.
sonar.php.coverage.reportPaths=tests/vv/reports/ci/clover-unit.xml
sonar.coverage.exclusions=src/Adapter/**,src/Core/Domain/Country/AddressFormat/AddressFormatFieldsProvider.php,src/Core/Domain/Country/AddressFormat/*Interface.php
sonar.php.tests.reportPath=tests/vv/reports/ci/junit-unit.xml
